name: privacy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Scan all tracked files
        run: bash scripts/privacy-guard.sh --all
      - name: Test the guard
        run: bash tests/test-privacy-guard.sh

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      # Scan the full history on each run. The gitleaks Action scans only the
      # pushed range, and it fails on the first push of a new repository.
      - name: Install gitleaks
        env:
          VERSION: 8.24.3
          SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "${RUNNER_TEMP}" gitleaks
      - name: Scan the full history
        run: '"${RUNNER_TEMP}/gitleaks" git --redact --no-banner -v .'
