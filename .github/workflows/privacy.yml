name: privacy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Scan all tracked files
        run: bash scripts/privacy-guard.sh --all
      - name: Test the guard
        run: bash tests/test-privacy-guard.sh

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
